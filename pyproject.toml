[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-sentinel"
version = "1.0.0"
description = "Verifiable OSINT & Counter-Disinformation Knowledge Graph"
authors = [
    { name = "Abenezer (Susan)", email = "contact@satiralabs.com" }
]
readme = "README.md"
requires-python = ">=3.8"
keywords = ["osint", "disinformation", "knowledge-graph", "fact-checking", "cryptographic-provenance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
]

[project.scripts]
sovereign-sentinel = "sentinel.cli:main"
